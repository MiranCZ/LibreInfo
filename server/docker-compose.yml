name: mhd

services:

  caddy:
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - gtfs-parser-public:/srv/gtfs:ro
    depends_on:
      - api
      - gtfs
    networks:
      - public
      - internal

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - scraper
      - gtfs
      - motis
    networks:
      - internal

  scraper:
    build: ./scraper
    restart: unless-stopped
    networks:
      - internal

  gtfs:
    build:
      context: ./gtfs
      additional_contexts:
        shared: ../shared
    restart: unless-stopped
    volumes:
      - gtfs-raw:/data/raw
      - osm-data:/data/osm
      - gtfs-parser-public:/public
      - ./gtfs-parser/state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - kordis_token
      - kordis_url
    networks:
      - internal

  motis:
    image: ghcr.io/motis-project/motis:pr-1469
    restart: unless-stopped
    volumes:
      - motis-data:/data
      - ./motis/config.yml:/config.yml:ro
      - gtfs-parser-public:/input/gtfs:ro
      - osm-data:/input/osm:ro
    networks:
      - internal

  motis-import:
    image: ghcr.io/motis-project/motis:pr-1469
    profiles: [tools]
    restart: "no"
    command: ["/motis", "import"]
    volumes:
      - motis-data:/data
      - ./motis/config.yml:/config.yml:ro
      - gtfs-parser-public:/input/gtfs:ro
      - osm-data:/input/osm:ro
    networks:
      - internal

  news:
    build: ./news
    restart: unless-stopped
    volumes:
      - news-data:/data
      - ./secrets:/secrets
    environment:
      - NEWSLETTER_SENDER=info@dpmb.cz
      - NEWSLETTER_SUBJECT=Newsletter
      - DEBUG=true
    networks:
      - internal


volumes:
  gtfs-raw:
  gtfs-data:
  gtfs-parser-public:
  osm-data:
  news-data:
  motis-data:
  caddy_data:
  caddy_config:

networks:
  public:
  internal:

secrets:
  kordis_url:
    file: ./secrets/kordis_url
  kordis_token:
    file: ./secrets/kordis_token