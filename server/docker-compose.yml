services:

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - public
      - internal

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - scraper
      - gtfs-rt
      - motis
    networks:
      - internal

  ofelia:
    image: mcuadros/ofelia:0.3.22
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./ofelia.ini:/etc/ofelia/config.ini

  scraper:
    build: ./scraper
    restart: unless-stopped
    networks:
      - internal

  gtfs-updater:
    build: ./gtfs-updater
    container_name: gtfs-updater
    restart: no
    volumes:
      - gtfs-data:/data/processed
      - gtfs-raw:/data/raw
      - osm-data:/data/osm
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  pfaedle:
    build:
      context: https://github.com/ad-freiburg/pfaedle.git#ad7b061fdef72fc084378d2f82bf1913faa1600a
      dockerfile: Dockerfile
    container_name: pfaedle
    restart: no
    profiles: [tools]
    volumes:
      - gtfs-raw:/gtfs
      - osm-data:/osm
      - gtfs-data:/gtfs-out
    command: -D -x /osm/region.osm.pbf -i /gtfs/gtfs.zip

  gtfs-static:
    build: ./gtfs-static
    container_name: gtfs-static
    restart: unless-stopped
    volumes:
      - gtfs-data:/data
    networks:
      - internal

  gtfs-rt:
    build: ./gtfs-rt
    restart: unless-stopped
    networks:
      - internal

  motis:
    image: ghcr.io/motis-project/motis:pr-1469
    container_name: motis
    restart: unless-stopped
    volumes:
      - motis-data:/data
      - ./motis/config.yml:/data/config.yml:ro
      - gtfs-data:/input/gtfs:ro
      - osm-data:/input/osm:ro
    networks:
      - internal

  motis-import:
    image: ghcr.io/motis-project/motis:pr-1469
    container_name: motis-import
    profiles: [tools]
    restart: "no"
    command: ["/motis", "import"]
    volumes:
      - motis-data:/data
      - ./motis/config.yml:/config.yml:ro
      - gtfs-data:/input/gtfs:ro
      - osm-data:/input/osm:ro
    networks:
      - internal

  news:
    build: ./news
    restart: unless-stopped
    volumes:
      - news-data:/data
      - ./secrets:/secrets
    environment:
      - NEWSLETTER_SENDER=info@dpmb.cz
      - NEWSLETTER_SUBJECT=Newsletter
      - DEBUG=true
    networks:
      - internal


volumes:
  gtfs-raw:
  gtfs-data:
  osm-data:
  news-data:
  motis-data:
  caddy_data:
  caddy_config:

networks:
  public:
  internal: